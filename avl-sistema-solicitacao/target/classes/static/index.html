<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Árvore AVL - Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        .card { box-shadow: 0 2px 10px rgba(0,0,0,.06); border: 0; }
        .tree { background: #111827; color: #e5e7eb; padding: 20px; border-radius: 10px; min-height: 240px; white-space: pre; font: 16px Consolas, monospace; overflow: auto; }
        .navbar-brand { font-weight: 700; }
        .toast { --bs-toast-max-width: 380px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Árvore AVL — Solicitações</span>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Cadastrar solicitação</h5>
                    <form id="formCadastro">
                        <div class="mb-3">
                            <label for="numero" class="form-label">Número</label>
                            <input id="numero" type="number" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="solicitante" class="form-label">Solicitante</label>
                            <input id="solicitante" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <input id="descricao" class="form-control" required>
                        </div>
                        <button class="btn btn-primary w-100">Inserir na AVL</button>
                    </form>
                    <hr>
                    <button id="carregarExemplo" class="btn btn-outline-secondary w-100">
                        Carregar dados do exercício
                    </button>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Visualização da AVL</h5>
                        <button id="atualizar" class="btn btn-sm btn-outline-primary">Atualizar</button>
                    </div>
                    <p class="text-muted small mt-2">O valor entre colchetes representa o fator de balanceamento (FB).</p>
                    <pre id="arvore" class="tree">Carregando...</pre>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Solicitações — percurso em ordem</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Solicitante</th>
                            <th>Data de abertura</th>
                            <th>Descrição</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast substitui alert()/popup e não interrompe a interação do usuário. -->
<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toastNotificacao" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="toastTitulo">Sistema AVL</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
        <div class="toast-body" id="toastMensagem"></div>
    </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarTitulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEditarTitulo">Alterar solicitação</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <input id="numeroEdicao" type="hidden">

                <div class="mb-3">
                    <label for="numeroEdicaoReadOnly" class="form-label">Número</label>
                    <input id="numeroEdicaoReadOnly" class="form-control" readonly>
                </div>

                <div class="mb-3">
                    <label for="dataEdicao" class="form-label">Data de abertura</label>
                    <input id="dataEdicao" class="form-control" readonly>
                </div>

                <div class="mb-3">
                    <label for="solicitanteEdicao" class="form-label">Solicitante</label>
                    <input id="solicitanteEdicao" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="descricaoEdicao" class="form-label">Descrição</label>
                    <textarea id="descricaoEdicao" class="form-control" rows="3" required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button id="btnSalvarAlteracao" type="button" class="btn btn-warning">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/solicitacoes';

function mostrarToast(titulo, mensagem) {
    document.getElementById('toastTitulo').textContent = titulo;
    document.getElementById('toastMensagem').textContent = mensagem;

    const elemento = document.getElementById('toastNotificacao');
    const toast = bootstrap.Toast.getOrCreateInstance(elemento, { delay: 3000 });
    toast.show();
}

function formatarData(dataIso) {
    if (!dataIso) {
        return '';
    }

    const data = new Date(dataIso);
    if (Number.isNaN(data.getTime())) {
        return dataIso;
    }

    const dia = String(data.getDate()).padStart(2, '0');
    const mes = String(data.getMonth() + 1).padStart(2, '0');
    const ano = data.getFullYear();
    const hora = String(data.getHours()).padStart(2, '0');
    const minuto = String(data.getMinutes()).padStart(2, '0');

    return `${dia}/${mes}/${ano} ${hora}:${minuto}`;
}

async function lerJsonSeguro(resposta) {
    try {
        return await resposta.json();
    } catch {
        return { sucesso: false, mensagem: 'Resposta inválida do servidor.' };
    }
}

async function atualizar() {
    try {
        const [listaResp, arvoreResp] = await Promise.all([
            fetch(API),
            fetch(API + '/arvore')
        ]);

        if (!listaResp.ok || !arvoreResp.ok) {
            throw new Error('Falha ao consultar a API.');
        }

        const lista = await listaResp.json();
        const arvore = await arvoreResp.text();

        document.getElementById('arvore').textContent = arvore.trim() || '(árvore vazia)';

        document.getElementById('tabela').innerHTML = lista.length
            ? lista.map(s => `
                <tr>
                    <td><strong>${s.numero}</strong></td>
                    <td>${s.solicitante}</td>
                    <td>${formatarData(s.dataAbertura)}</td>
                    <td>${s.descricao}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-warning me-2" onclick='editar(${s.numero}, ${JSON.stringify(s.solicitante)}, ${JSON.stringify(s.descricao)}, ${JSON.stringify(s.dataAbertura)})'>
                            Editar
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="remover(${s.numero})">
                            Remover
                        </button>
                    </td>
                </tr>`).join('')
            : '<tr><td colspan="5" class="text-center text-muted">Nenhuma solicitação cadastrada.</td></tr>';
    } catch (erro) {
        mostrarToast('Erro', 'Não foi possível acessar a API. Verifique se o Spring Boot está executando.');
    }
}

async function inserir(numero, descricao, solicitante, silencioso = false) {
    const resposta = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero, solicitante, descricao })
    });

    const dados = await lerJsonSeguro(resposta);

    if (!resposta.ok) {
        throw new Error(dados.mensagem || 'Não foi possível cadastrar.');
    }

    if (!silencioso) {
        mostrarToast('Sucesso', dados.mensagem);
    }
}

async function remover(numero) {
    try {
        const resposta = await fetch(API + '/' + numero, { method: 'DELETE' });
        const dados = await lerJsonSeguro(resposta);

        if (!resposta.ok) {
            mostrarToast('Atenção', dados.mensagem || 'Solicitação não encontrada.');
            return;
        }

        mostrarToast('Remoção', dados.mensagem);
        await atualizar();
    } catch (erro) {
        mostrarToast('Erro', 'Não foi possível comunicar com o servidor.');
    }
}

function editar(numero, solicitante, descricao, dataAbertura) {
    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalEditar'));
    document.getElementById('numeroEdicao').value = numero;
    document.getElementById('numeroEdicaoReadOnly').value = numero;
    document.getElementById('dataEdicao').value = formatarData(dataAbertura);
    document.getElementById('solicitanteEdicao').value = solicitante;
    document.getElementById('descricaoEdicao').value = descricao;
    modal.show();
}

async function alterar() {
    const numero = Number(document.getElementById('numeroEdicao').value);
    const solicitante = document.getElementById('solicitanteEdicao').value.trim();
    const descricao = document.getElementById('descricaoEdicao').value.trim();

    if (!numero || !solicitante || !descricao) {
        mostrarToast('Atenção', 'Informe o solicitante e a descrição da solicitação.');
        return;
    }

    try {
        const resposta = await fetch(`${API}/${numero}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ solicitante, descricao })
        });

        const dados = await lerJsonSeguro(resposta);

        if (!resposta.ok) {
            mostrarToast('Erro', dados.mensagem || 'Não foi possível alterar.');
            return;
        }

        const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalEditar'));
        modal.hide();
        mostrarToast('Sucesso', dados.mensagem);
        await atualizar();
    } catch (erro) {
        mostrarToast('Erro', 'Não foi possível comunicar com o servidor.');
    }
}

document.getElementById('formCadastro').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const numero = Number(document.getElementById('numero').value);
    const solicitante = document.getElementById('solicitante').value.trim();
    const descricao = document.getElementById('descricao').value.trim();

    if (!numero || !solicitante || !descricao) {
        mostrarToast('Atenção', 'Preencha número, solicitante e descrição.');
        return;
    }

    try {
        await inserir(numero, descricao, solicitante);
        evento.target.reset();
        document.getElementById('numero').focus();
        await atualizar();
    } catch (erro) {
        mostrarToast('Erro', erro.message);
    }
});

document.getElementById('btnSalvarAlteracao').addEventListener('click', alterar);
document.getElementById('atualizar').addEventListener('click', atualizar);

document.getElementById('carregarExemplo').addEventListener('click', async () => {
    const dados = [
        [50, 'Paulo Lima', 'Problema no servidor'],
        [30, 'Carlos Souza', 'Computador não inicia'],
        [70, 'Ana Costa', 'Falha de conexão'],
        [20, 'João Oliveira', 'Impressora não funciona'],
        [40, 'Marina Rocha', 'Erro no sistema'],
        [60, 'Rafael Dias', 'Problema de acesso'],
        [80, 'Larissa Mendes', 'Troca de equipamento'],
        [10, 'Bruno Silva', 'Instalação de software'],
        [25, 'Nina Alves', 'Configuração de usuário']
    ];

    let inseridos = 0;

    for (const [numero, solicitante, descricao] of dados) {
        try {
            await inserir(numero, descricao, solicitante, true);
            inseridos++;
        } catch {
            // Registros já existentes são ignorados ao carregar o exemplo.
        }
    }

    if (inseridos > 0) {
        mostrarToast('Exemplo carregado', `${inseridos} solicitação(ões) inserida(s).`);
    } else {
        mostrarToast('Informação', 'Os dados do exercício já estão cadastrados.');
    }

    await atualizar();
});

atualizar();
</script>
</body>
</html>
